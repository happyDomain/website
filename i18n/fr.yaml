- id: checks-dangling-tag
  translation: "Étude de cas"
- id: checks-dangling-title
  translation: "Enregistrements orphelins : le détournement que personne ne voit venir"
- id: checks-dangling-text
  translation: "Un enregistrement CNAME, MX, NS ou SRV peut continuer de pointer vers une ressource que vous ne contrôlez plus : un SaaS décommissionné, un domaine expiré, un serveur de noms mal orthographié. N'importe qui peut alors récupérer cette cible et publier du contenu, intercepter vos mails ou obtenir des certificats valides en votre nom."
- id: checks-dangling-text2
  translation: |
    Le risque n'est pas théorique. L'<a href="https://shhaos.github.io/papers/ccs16-dares.pdf" target="_blank">étude de référence sur le sujet</a>, <a href="https://youtube.com/watch?v=2OQ5yysJPlI" target="_blank">présentée à l'ACM CCS 2016</a>, a recensé 467 enregistrements orphelins exploitables dans 277 domaines du top 10 000 Alexa et 52 zones .edu. Depuis, <a href="https://arstechnica.com/security/2026/04/why-are-top-university-websites-serving-porn-it-comes-down-to-shoddy-housekeeping/" target="_blank">de grandes universités ont été surprises à servir du porno via des CNAME oubliés en avril 2026</a>, et <a href="https://krebsonsecurity.com/2025/01/mastercard-dns-error-went-unnoticed-for-years/" target="_blank">une faute de frappe dans l'un des serveurs de noms de MasterCard est passée inaperçue pendant près de cinq ans et n'a été révélée qu'en janvier 2025</a>. Le testeur dangling-records de happyDomain parcourt chaque pointeur de votre zone, résout sa cible et vérifie son enregistrement, pour que ces enregistrements oubliés remontent avant que quelqu'un d'autre ne les trouve.
- id: checks-dangling-link
  translation: "Découvrir notre testeur dangling-records"
- id: checks-dangling-caption
  translation: "La vérification des enregistrements orphelins de happyDomain en action : un CNAME oublié signalé avant que quelqu'un ne puisse le récupérer."
- id: checks-footer
  translation: "Chaque vérification rapporte un statut clair, et vous êtes notifié dès que l'un d'eux change."
- id: checks-footer-link
  translation: "Découvrez tous les testeurs dans la documentation"
- id: checks-more
  translation: "+{{ .Count }} autres testeurs"

