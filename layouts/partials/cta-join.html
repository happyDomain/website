<!-- Call to Action Section -->
<section id="cta">
    <div class="container">
        <div class="cta-glass cta-content" style="text-wrap: balance">
            <h2 class="display-5 fw-bold mb-4">
                {{ i18n "cta-account-title" }}
            </h2>
            <div class="d-flex justify-content-center mb-4">
                <!-- No .text-light: #cta already pins its own light color, and
                     .text-light would flip to near-black in dark mode. -->
                <p class="lead">{{ i18n "cta-account-text" }}</p>
            </div>
            <a
                href="/{{ .Site.Language.Lang }}/beta/"
                class="btn btn-lg btn-light px-4"
                style="border-radius: 2em"
                data-umami-event="cta-join"
            >
                {{ i18n "cta-account-button" }}
            </a>
        </div>
    </div>
</section>
